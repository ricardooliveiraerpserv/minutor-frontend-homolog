<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mudanças no Ambiente — ERPServ</title>
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>

<div class="bg-gradient"></div>

<div id="loading-overlay">
  <div class="spinner"></div>
  <p id="loading-text">Carregando...</p>
</div>

<div class="dashboard-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="../sites/assets/erpserv-logo.png" alt="ERPServ" onerror="this.style.display='none'">
      <span class="sidebar-logo-text">ERPServ</span>
    </div>

    <span class="nav-section-label">Principal</span>
    <a href="dashboard.html" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
      </svg>
      <span>Dashboard</span>
    </a>
    <a href="configurator.html" class="nav-item" id="nav-configurator" style="display:none">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/>
      </svg>
      <span>Configurador</span>
    </a>
    <a href="users.html" class="nav-item" id="nav-users" style="display:none">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      <span>Usuários</span>
    </a>

    <span class="nav-section-label">Inventário</span>
    <a href="fontes.html" class="nav-item" id="nav-fontes" style="display:none">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2v-4M9 21H5a2 2 0 0 1-2-2v-4m0 0h18"/>
      </svg>
      <span>Fontes</span>
    </a>

    <span class="nav-section-label">Histórico</span>
    <a href="changes.html" class="nav-item active">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/>
      </svg>
      <span>Mudanças</span>
    </a>
    <a href="audit.html" class="nav-item" id="nav-audit" style="display:none">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
      <span>Auditoria</span>
    </a>

    <div class="sidebar-footer">
      <div class="user-badge">
        <div class="user-avatar" id="user-avatar">?</div>
        <div class="user-info">
          <div class="user-name" id="user-name">—</div>
          <div class="user-role" id="user-role">—</div>
        </div>
      </div>
      <button class="btn btn-ghost btn-full btn-sm" id="btn-logout">Sair</button>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">Mudanças no Ambiente</h1>
        <p class="page-sub">Histórico de compilações, patches e promoções de RPO</p>
      </div>
      <button class="btn btn-ghost btn-sm" id="btn-refresh">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.95"/>
        </svg>
        Atualizar
      </button>
    </div>

    <!-- FILTERS -->
    <div class="panel" style="padding:16px 20px;margin-bottom:20px">
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
        <div class="field" style="margin:0;flex:0 0 auto">
          <label style="font-size:11px;color:var(--text-3);display:block;margin-bottom:4px">Data</label>
          <input type="date" id="filter-date" class="search-input" style="width:150px">
        </div>
        <div class="field" style="margin:0;flex:0 0 auto">
          <label style="font-size:11px;color:var(--text-3);display:block;margin-bottom:4px">Tipo</label>
          <select id="filter-type" class="search-input" style="width:180px">
            <option value="">Todos</option>
            <option value="compile">Compilação</option>
            <option value="patch-apply">Aplicação de Patch</option>
            <option value="promote-rpo">Promoção de RPO</option>
            <option value="rollback-rpo">Rollback de RPO</option>
          </select>
        </div>
        <div class="field" style="margin:0;flex:0 0 auto">
          <label style="font-size:11px;color:var(--text-3);display:block;margin-bottom:4px">Limite</label>
          <select id="filter-limit" class="search-input" style="width:100px">
            <option value="25">25</option>
            <option value="50" selected>50</option>
            <option value="100">100</option>
          </select>
        </div>
        <button class="btn btn-primary btn-sm" id="btn-apply-filter" style="align-self:flex-end;margin-bottom:1px">Filtrar</button>
      </div>
    </div>

    <!-- TABLE -->
    <div class="panel">
      <table class="data-table" id="changes-table">
        <thead>
          <tr>
            <th style="width:160px">Data/Hora</th>
            <th style="width:150px">Tipo</th>
            <th style="width:120px">Usuário</th>
            <th>Arquivos</th>
            <th style="width:90px">Resultado</th>
          </tr>
        </thead>
        <tbody id="changes-tbody">
          <tr><td colspan="5" style="text-align:center;padding:32px;color:var(--text-3)">Carregando...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- OUTPUT PANEL (shown when row clicked) -->
    <div id="output-panel" style="display:none;margin-top:20px">
      <div class="section-sep" id="output-title" style="cursor:pointer" onclick="closeOutput()">
        Output — <span id="output-entry-label"></span>
        <span style="font-size:12px;float:right;margin-top:2px">✕ fechar</span>
      </div>
      <div class="panel" style="padding:16px">
        <pre id="output-content" class="console-viewer" style="max-height:400px;overflow-y:auto;font-size:11px;white-space:pre-wrap;padding:12px;margin:0;border-radius:8px;background:rgba(0,0,0,0.3)"></pre>
      </div>
    </div>
  </main>
</div>

<script src="js/app.js"></script>
<script src="js/changes.js"></script>
</body>
</html>
