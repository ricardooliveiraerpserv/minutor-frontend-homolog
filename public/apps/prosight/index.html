<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProSight — Acesso</title>
  <link rel="stylesheet" href="css/theme.css">
</head>
<body class="login-body">

<div class="bg-gradient"></div>

<div id="loading-overlay">
  <div class="spinner"></div>
  <p id="loading-text">Autenticando...</p>
</div>

<div class="login-card glass">
  <h1 class="login-title">ProSight</h1>
  <p class="login-sub">Controle de Fontes TOTVS</p>

  <div id="error-msg" class="alert error hidden">
    <span>&#9888;</span>
    <span id="error-msg-text">Credenciais inválidas</span>
  </div>

  <form id="login-form">
    <div class="field">
      <label for="username">Usuário</label>
      <input type="text" id="username" name="username"
             autocomplete="username" required placeholder="seu.login">
    </div>

    <div class="field">
      <label for="password">Senha</label>
      <input type="password" id="password" name="password"
             autocomplete="current-password" required placeholder="••••••••">
    </div>

    <button type="submit" class="btn btn-primary btn-full" style="margin-top:8px">
      Entrar
    </button>
  </form>
</div>

<script>
  const form    = document.getElementById('login-form');
  const errDiv  = document.getElementById('error-msg');
  const errText = document.getElementById('error-msg-text');
  const overlay = document.getElementById('loading-overlay');

  function showErr(msg) {
    errText.textContent = msg;
    errDiv.classList.remove('hidden');
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    errDiv.classList.add('hidden');
    overlay.classList.add('visible');

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value,
        }),
      });

      const data = await res.json();

      if (res.ok && data.success) {
        sessionStorage.setItem('token', data.token);
        sessionStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = 'dashboard.html';
      } else {
        showErr(data.error || 'Credenciais inválidas');
      }
    } catch {
      showErr('Erro de conexão com o servidor');
    } finally {
      overlay.classList.remove('visible');
    }
  });

  const token = sessionStorage.getItem('token');
  if (token) window.location.href = 'dashboard.html';
</script>
</body>
</html>
