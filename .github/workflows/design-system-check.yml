name: Design System check

# Detecta cores hardcoded e classes Tailwind dark-only em arquivos
# alterados pelo PR. Reporta como warnings inline (annotations) — NÃO
# bloqueia o build. Política descrita em docs/DESIGN_SYSTEM.md.

on:
  pull_request:
    paths:
      - 'src/**'
      - '.github/workflows/design-system-check.yml'

jobs:
  ds-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect hardcoded colors and dark-only Tailwind classes
        shell: bash
        run: |
          set -euo pipefail
          BASE_REF="origin/${{ github.base_ref }}"

          # Lista arquivos alterados (Added/Modified) restritos a src/**
          # Ignora globals.css (que LEGITIMAMENTE define os tokens)
          mapfile -t FILES < <(
            git diff "$BASE_REF"...HEAD --name-only --diff-filter=AM \
              | grep -E '^src/.+\.(tsx?|css)$' \
              | grep -v '^src/app/globals\.css$' \
              || true
          )

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "Nenhum arquivo .tsx/.ts/.css relevante alterado."
            exit 0
          fi

          echo "Arquivos sob análise: ${#FILES[@]}"

          TOTAL_HEX_RGBA=0
          TOTAL_DARK_TW=0

          for f in "${FILES[@]}"; do
            [ -f "$f" ] || continue

            # 1. Hex literais (#fff, #ffffff) ou rgb()/rgba() em código
            #    Exclui linhas que começam com comentário CSS (* ou /*) ou JS (//)
            HITS_HEX=$(
              grep -nE '#[0-9a-fA-F]{3}([0-9a-fA-F]{3})?\b|rgba?\(' "$f" \
                | grep -vE ':\s*(\*|//|/\*)' \
                || true
            )
            if [ -n "$HITS_HEX" ]; then
              while IFS= read -r line; do
                LINE_NUM=$(echo "$line" | cut -d':' -f1)
                CONTENT=$(echo "$line" | cut -d':' -f2- | sed 's/^ *//' | head -c 200)
                printf '::warning file=%s,line=%s::Cor hardcoded — usar token do DS (var(--surface), var(--text), etc.). Conteudo: %s\n' "$f" "$LINE_NUM" "$CONTENT"
                TOTAL_HEX_RGBA=$((TOTAL_HEX_RGBA + 1))
              done <<< "$HITS_HEX"
            fi

            # 2. Classes Tailwind dark-only que quebram o tema light:
            #    bg-(zinc|neutral|slate|gray)-(8|9)XX
            #    border-(zinc|neutral|slate|gray)-(7|8|9)XX
            HITS_TW=$(
              grep -nE '\b(bg-(zinc|neutral|slate|gray)-(8|9)[0-9]{2}|border-(zinc|neutral|slate|gray)-(7|8|9)[0-9]{2})\b' "$f" \
                || true
            )
            if [ -n "$HITS_TW" ]; then
              while IFS= read -r line; do
                LINE_NUM=$(echo "$line" | cut -d':' -f1)
                CONTENT=$(echo "$line" | cut -d':' -f2- | sed 's/^ *//' | head -c 200)
                printf '::warning file=%s,line=%s::Classe Tailwind dark-only — usar token do DS / .ds-card. Conteudo: %s\n' "$f" "$LINE_NUM" "$CONTENT"
                TOTAL_DARK_TW=$((TOTAL_DARK_TW + 1))
              done <<< "$HITS_TW"
            fi
          done

          echo ""
          echo "Resumo: $TOTAL_HEX_RGBA cor(es) hex/rgba | $TOTAL_DARK_TW classe(s) dark-only"
          echo "Detalhes nas annotations do PR. Politica em docs/DESIGN_SYSTEM.md."
          # Exit 0 sempre — warnings nao bloqueiam o merge.
          exit 0
